<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iskander Marathon Runner</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: monospace;
}
canvas {
  border: 2px solid #333;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
</style>
</head>
<body>
<canvas id="game" width="800" height="400"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// ---- Constants ----
const RACE_DISTANCE_KM = 42;
const METERS_PER_KM = 1000;
const TOTAL_METERS = RACE_DISTANCE_KM * METERS_PER_KM;
const GROUND_Y = 320;
const RUNNER_X = 150;
const PITSTOP_EVERY_KM = 5;

// Pixels per meter for world scrolling
const PIXELS_PER_METER = 8;

// ---- Game State ----
const game = {
  state: 'title', // title, running, finished
  distance: 0,       // meters traveled
  speed: 0,          // current m/s
  maxSpeed: 6,
  stamina: 100,
  maxStamina: 100,
  power: 100,
  maxPower: 100,
  time: 0,           // seconds elapsed
  pressTimestamps: [],
  lastPressTime: 0,
  stepQueued: false,
  worldX: 0,         // camera scroll offset in pixels
  finishTime: null,
  raceResult: null,   // 'win' or 'lose'
  // Runner animation
  runner: {
    y: GROUND_Y - 32,
    frame: 0,
    frameTimer: 0,
    bobY: 0,
    stepping: false,
    stepAnim: 0
  }
};

// ---- Input ----
const keys = {};
let spaceJustPressed = false;

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (!keys['Space']) {
      keys['Space'] = true;
      spaceJustPressed = true;
    }
  }
});

document.addEventListener('keyup', (e) => {
  if (e.code === 'Space') {
    keys['Space'] = false;
  }
});

// ---- Press frequency tracking ----
function registerPress() {
  const now = performance.now();
  game.pressTimestamps.push(now);
  // Keep only last 2 seconds of presses
  const cutoff = now - 2000;
  game.pressTimestamps = game.pressTimestamps.filter(t => t > cutoff);
  game.lastPressTime = now;
}

function getPressFrequency() {
  const now = performance.now();
  const cutoff = now - 2000;
  const recent = game.pressTimestamps.filter(t => t > cutoff);
  if (recent.length < 2) return recent.length * 0.5;
  const span = (now - recent[0]) / 1000;
  if (span < 0.01) return 0;
  return recent.length / span;
}

// ---- Power curve: decreases first half, increases second half ----
function getPowerMultiplier() {
  const progress = game.distance / TOTAL_METERS;
  // U-shaped curve: high at start, low at middle, high at end
  // power = 1 - 0.6 * sin(pi * progress)
  return 1 - 0.6 * Math.sin(Math.PI * progress);
}

// ---- Update ----
let lastTime = 0;

function update(dt) {
  if (game.state !== 'running') return;

  game.time += dt;

  // Handle space press
  if (spaceJustPressed) {
    spaceJustPressed = false;
    registerPress();
    game.runner.stepping = true;
    game.runner.stepAnim = 0;
  }

  // Calculate target speed from press frequency
  const freq = getPressFrequency();
  // freq of ~5-8 presses/sec = fast running
  const normalizedFreq = Math.min(freq / 7, 1);
  const powerMult = getPowerMultiplier();
  const staminaMult = game.stamina / game.maxStamina;
  const targetSpeed = normalizedFreq * game.maxSpeed * powerMult * staminaMult;

  // Smooth speed transition
  game.speed += (targetSpeed - game.speed) * Math.min(dt * 3, 1);

  // If no recent presses, decelerate
  const timeSincePress = (performance.now() - game.lastPressTime) / 1000;
  if (timeSincePress > 1.0) {
    game.speed *= Math.pow(0.3, dt);
  }

  // Stamina: drains with high frequency, recovers at low frequency
  const staminaDrain = normalizedFreq * 8 * dt;  // drain rate
  const staminaRecovery = (1 - normalizedFreq) * 3 * dt; // recovery rate
  game.stamina = Math.max(0, Math.min(game.maxStamina, game.stamina - staminaDrain + staminaRecovery));

  // Power follows the curve (not directly controllable)
  game.power = getPowerMultiplier() * game.maxPower;

  // Move distance
  game.distance += game.speed * dt;
  game.worldX = game.distance * PIXELS_PER_METER;

  // Runner animation
  if (game.speed > 0.3) {
    game.runner.frameTimer += dt * game.speed * 2;
    if (game.runner.frameTimer > 1) {
      game.runner.frameTimer = 0;
      game.runner.frame = (game.runner.frame + 1) % 4;
    }
    game.runner.bobY = Math.sin(game.runner.frameTimer * Math.PI) * 2;
  } else {
    game.runner.frame = 0;
    game.runner.bobY = 0;
  }

  if (game.runner.stepping) {
    game.runner.stepAnim += dt * 8;
    if (game.runner.stepAnim > 1) {
      game.runner.stepping = false;
    }
  }

  // Check finish
  if (game.distance >= TOTAL_METERS) {
    game.distance = TOTAL_METERS;
    game.state = 'finished';
    game.finishTime = game.time;
    // Target: ~2.5 hours = 9000 seconds for a good time
    game.raceResult = game.time < 12000 ? 'win' : 'lose';
  }
}

// ---- Drawing helpers ----
function drawPixelRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
}

// ---- Draw Runner (pixel art stick figure) ----
function drawRunner() {
  const x = RUNNER_X;
  const baseY = GROUND_Y - 32 + game.runner.bobY;
  const frame = game.runner.frame;

  // Colors
  const skin = '#f5c6a0';
  const shirt = '#e63946';
  const shorts = '#1d3557';
  const shoes = '#f1faee';
  const hair = '#2b2d42';

  // Head
  drawPixelRect(x + 4, baseY, 8, 8, skin);
  // Hair
  drawPixelRect(x + 4, baseY, 8, 3, hair);
  // Eyes
  drawPixelRect(x + 9, baseY + 3, 2, 2, '#2b2d42');

  // Body / shirt
  drawPixelRect(x + 3, baseY + 8, 10, 10, shirt);
  // Number on shirt
  drawPixelRect(x + 6, baseY + 10, 4, 4, '#f1faee');

  // Arms (animated)
  if (game.speed > 0.3) {
    // Running arm animation
    const armSwing = frame < 2 ? 1 : -1;
    // Left arm
    drawPixelRect(x + 1, baseY + 8 + armSwing * 2, 3, 6, skin);
    // Right arm
    drawPixelRect(x + 12, baseY + 8 - armSwing * 2, 3, 6, skin);
  } else {
    // Standing arms
    drawPixelRect(x + 1, baseY + 8, 3, 8, skin);
    drawPixelRect(x + 12, baseY + 8, 3, 8, skin);
  }

  // Shorts
  drawPixelRect(x + 3, baseY + 18, 5, 4, shorts);
  drawPixelRect(x + 8, baseY + 18, 5, 4, shorts);

  // Legs (animated)
  if (game.speed > 0.3) {
    const legOffset = frame % 2 === 0 ? 3 : -3;
    // Left leg
    drawPixelRect(x + 4 + legOffset, baseY + 22, 4, 8, skin);
    drawPixelRect(x + 4 + legOffset, baseY + 28, 5, 3, shoes);
    // Right leg
    drawPixelRect(x + 8 - legOffset, baseY + 22, 4, 8, skin);
    drawPixelRect(x + 8 - legOffset, baseY + 28, 5, 3, shoes);
  } else {
    // Standing legs
    drawPixelRect(x + 4, baseY + 22, 4, 8, skin);
    drawPixelRect(x + 4, baseY + 28, 5, 3, shoes);
    drawPixelRect(x + 8, baseY + 22, 4, 8, skin);
    drawPixelRect(x + 8, baseY + 28, 5, 3, shoes);
  }
}

// ---- Draw Ground ----
function drawGround() {
  const scene = getCurrentScene();

  // Ground base
  ctx.fillStyle = '#4a5568';
  ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

  // Road surface - varies by scene
  if (scene === 0) {
    // Embankment: cobblestone-like
    ctx.fillStyle = '#78909c';
    ctx.fillRect(0, GROUND_Y, canvas.width, 40);
    // Cobblestone pattern
    ctx.fillStyle = '#90a4ae';
    const cobOff = -(game.worldX % 16);
    for (let row = 0; row < 3; row++) {
      const rowOff = row % 2 === 0 ? 0 : 8;
      for (let cx = cobOff - 16 + rowOff; cx < canvas.width + 16; cx += 16) {
        ctx.fillRect(Math.floor(cx), GROUND_Y + 2 + row * 12, 14, 10);
      }
    }
    // Curb
    ctx.fillStyle = '#b0bec5';
    ctx.fillRect(0, GROUND_Y - 2, canvas.width, 3);
  } else if (scene === 1) {
    // Park: asphalt path with grass edges
    ctx.fillStyle = '#4caf50';
    ctx.fillRect(0, GROUND_Y, canvas.width, 40);
    // Asphalt path in center
    ctx.fillStyle = '#616161';
    ctx.fillRect(0, GROUND_Y + 5, canvas.width, 25);
    // Path edges
    ctx.fillStyle = '#757575';
    ctx.fillRect(0, GROUND_Y + 5, canvas.width, 2);
    ctx.fillRect(0, GROUND_Y + 28, canvas.width, 2);
  } else {
    // Moscow City: modern road
    ctx.fillStyle = '#424242';
    ctx.fillRect(0, GROUND_Y, canvas.width, 40);
    // Lane markings
    ctx.fillStyle = '#ffd600';
    ctx.fillRect(0, GROUND_Y + 2, canvas.width, 2);
  }

  // Road markings (scrolling dashes)
  ctx.fillStyle = '#e2e8f0';
  const markSpacing = 60;
  const offset = -(game.worldX % markSpacing);
  for (let i = offset; i < canvas.width + markSpacing; i += markSpacing) {
    ctx.fillRect(Math.floor(i), GROUND_Y + 18, 20, 3);
  }

  // Sidewalk edge
  ctx.fillStyle = '#9e9e9e';
  ctx.fillRect(0, GROUND_Y + 38, canvas.width, 2);
}

// ---- Scene system: Moscow backgrounds change with distance ----
// Scene 0 (0-14 km): Kremlin Embankment - river, Kremlin walls, towers
// Scene 1 (14-28 km): Gorky Park - trees, park entrance arch, paths
// Scene 2 (28-42 km): Moscow City - modern skyscrapers, bridge, return to Kremlin view at finish

function getCurrentScene() {
  const km = game.distance / METERS_PER_KM;
  if (km < 14) return 0;
  if (km < 28) return 1;
  return 2;
}

// Blend factor for smooth transitions (0..1, 1 = fully new scene)
function getSceneBlend() {
  const km = game.distance / METERS_PER_KM;
  const transitionWidth = 1.5; // km over which blend happens
  if (km < 14 - transitionWidth) return 0;
  if (km < 14) return (km - (14 - transitionWidth)) / transitionWidth;
  if (km < 14 + transitionWidth) return 1 - (km - 14) / transitionWidth;
  if (km < 28 - transitionWidth) return 0;
  if (km < 28) return (km - (28 - transitionWidth)) / transitionWidth;
  if (km < 28 + transitionWidth) return 1 - (km - 28) / transitionWidth;
  return 0;
}

// ---- Draw Sky ----
function drawSky() {
  const scene = getCurrentScene();
  let colors;
  if (scene === 0) {
    // Dawn/morning sky for Kremlin embankment
    colors = ['#1a1a2e', '#16213e', '#2a4a7f', '#5b86c5'];
  } else if (scene === 1) {
    // Daytime sky for Gorky Park
    colors = ['#1565c0', '#1e88e5', '#42a5f5', '#90caf9'];
  } else {
    // Late afternoon/sunset for Moscow City
    colors = ['#1a1a2e', '#4a1942', '#c0392b', '#e67e22'];
  }
  const bandH = 80;
  for (let i = 0; i < colors.length; i++) {
    ctx.fillStyle = colors[i];
    ctx.fillRect(0, i * bandH, canvas.width, bandH);
  }

  // Sun/moon depending on scene
  if (scene === 1) {
    // Sun in daytime
    ctx.fillStyle = '#fff59d';
    ctx.beginPath();
    ctx.arc(650, 60, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff9c4';
    ctx.beginPath();
    ctx.arc(650, 60, 25, 0, Math.PI * 2);
    ctx.globalAlpha = 0.3;
    ctx.fill();
    ctx.globalAlpha = 1;
  } else if (scene === 2) {
    // Setting sun
    ctx.fillStyle = '#ff7043';
    ctx.beginPath();
    ctx.arc(700, 200, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffab91';
    ctx.beginPath();
    ctx.arc(700, 200, 40, 0, Math.PI * 2);
    ctx.globalAlpha = 0.2;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ---- Draw Background (delegates to current scene) ----
function drawBackground() {
  const scene = getCurrentScene();
  const parallax = game.worldX * 0.15;

  if (scene === 0) {
    drawKremlinEmbankment(parallax);
  } else if (scene === 1) {
    drawGorkyPark(parallax);
  } else {
    drawMoscowCity(parallax);
  }
}

// ---- Scene 0: Kremlin Embankment ----
function drawKremlinEmbankment(parallax) {
  // Far background: river
  const riverY = GROUND_Y - 30;

  // Kremlin wall (continuous, slow parallax)
  const wallParallax = parallax * 0.6;
  const wallHeight = 70;
  const wallY = GROUND_Y - wallHeight - 40;

  // Draw river behind the wall
  ctx.fillStyle = '#1565c0';
  ctx.fillRect(0, riverY - 15, canvas.width, 45);
  // River waves
  ctx.fillStyle = '#1e88e5';
  const waveOff = -(parallax * 0.3) % 40;
  for (let wx = waveOff - 40; wx < canvas.width + 40; wx += 40) {
    ctx.fillRect(Math.floor(wx), riverY - 10, 20, 3);
    ctx.fillRect(Math.floor(wx) + 10, riverY, 15, 2);
  }

  // Kremlin wall
  ctx.fillStyle = '#8b4513';
  ctx.fillRect(0, wallY, canvas.width, wallHeight);

  // Wall texture - brick lines
  ctx.fillStyle = '#7a3b10';
  for (let by = wallY + 8; by < wallY + wallHeight; by += 10) {
    const brickOff = (by % 20 === 0) ? 0 : 15;
    for (let bx = -(wallParallax % 30) - 30 + brickOff; bx < canvas.width + 30; bx += 30) {
      ctx.fillRect(Math.floor(bx), by, 1, 8);
    }
  }

  // Crenellations (merlons) on top of wall
  ctx.fillStyle = '#8b4513';
  const crenOff = -(wallParallax % 24);
  for (let cx = crenOff - 24; cx < canvas.width + 24; cx += 24) {
    ctx.fillRect(Math.floor(cx), wallY - 12, 14, 12);
  }

  // Kremlin towers at intervals
  const towerSpacing = 1200;
  const towerOff = -(wallParallax % towerSpacing);
  for (let shift = towerOff - towerSpacing; shift < canvas.width + towerSpacing; shift += towerSpacing) {
    drawKremlinTowerDetailed(shift + 200, wallY);
    drawKremlinTowerDetailed(shift + 700, wallY);
  }

  // Embankment railing in foreground
  ctx.fillStyle = '#546e7a';
  const railOff = -(parallax % 50);
  for (let rx = railOff - 50; rx < canvas.width + 50; rx += 50) {
    // Railing post
    ctx.fillRect(Math.floor(rx), GROUND_Y - 25, 3, 25);
  }
  // Top rail
  ctx.fillRect(0, GROUND_Y - 25, canvas.width, 2);
}

function drawKremlinTowerDetailed(tx, wallY) {
  if (tx < -120 || tx > canvas.width + 120) return;

  tx = Math.floor(tx);
  const towerW = 50;
  const towerH = 140;
  const towerY = wallY - towerH + 70;

  // Tower body
  ctx.fillStyle = '#6c3a2a';
  ctx.fillRect(tx - towerW / 2, towerY, towerW, towerH);

  // Tower narrowing section
  ctx.fillStyle = '#7a4a30';
  ctx.fillRect(tx - towerW / 2 + 5, towerY - 20, towerW - 10, 25);

  // Pointed roof
  ctx.fillStyle = '#2e7d32';
  ctx.beginPath();
  ctx.moveTo(tx - towerW / 2 - 2, towerY - 20);
  ctx.lineTo(tx, towerY - 70);
  ctx.lineTo(tx + towerW / 2 + 2, towerY - 20);
  ctx.fill();

  // Spire
  ctx.fillStyle = '#ffd600';
  ctx.fillRect(tx - 1, towerY - 82, 3, 14);

  // Red star
  ctx.fillStyle = '#e63946';
  drawPixelRect(tx - 4, towerY - 88, 9, 8, '#e63946');

  // Clock face on tower
  ctx.fillStyle = '#fff9c4';
  ctx.beginPath();
  ctx.arc(tx, towerY + 30, 10, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#2d3436';
  ctx.fillRect(tx - 1, towerY + 22, 2, 9);
  ctx.fillRect(tx - 1, towerY + 28, 7, 2);

  // Windows
  ctx.fillStyle = '#ffeaa7';
  for (let wy = towerY + 50; wy < towerY + towerH - 10; wy += 18) {
    ctx.fillRect(tx - 8, wy, 5, 8);
    ctx.fillRect(tx + 3, wy, 5, 8);
  }
}

// ---- Scene 1: Gorky Park ----
function drawGorkyPark(parallax) {
  // Background: distant trees (very slow parallax)
  const farParallax = parallax * 0.3;
  ctx.fillStyle = '#2e7d32';
  const treeLineY = GROUND_Y - 100;
  // Treeline silhouette
  const treeSp = 40;
  const treeOff = -(farParallax % treeSp);
  for (let tx = treeOff - treeSp; tx < canvas.width + treeSp; tx += treeSp) {
    const th = 40 + ((Math.floor(tx + farParallax) * 7) & 31);
    ctx.fillStyle = '#1b5e20';
    // Tree crown (circle-ish)
    ctx.beginPath();
    ctx.arc(Math.floor(tx), treeLineY - th / 2 + 20, th / 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Mid-ground: park elements (medium parallax)
  const midParallax = parallax * 0.5;

  // Park entrance arch (appears periodically)
  const archSpacing = 2000;
  const archOff = -(midParallax % archSpacing);
  for (let shift = archOff - archSpacing; shift < canvas.width + archSpacing; shift += archSpacing) {
    drawParkArch(shift + 400);
  }

  // Benches
  const benchSp = 600;
  const benchOff = -(midParallax % benchSp);
  for (let bx = benchOff - benchSp; bx < canvas.width + benchSp; bx += benchSp) {
    drawParkBench(Math.floor(bx + 100));
  }

  // Foreground trees (closer, faster parallax)
  const nearParallax = parallax * 0.7;
  const nearTreeSp = 200;
  const nearTreeOff = -(nearParallax % nearTreeSp);
  for (let tx = nearTreeOff - nearTreeSp; tx < canvas.width + nearTreeSp; tx += nearTreeSp) {
    drawParkTree(Math.floor(tx), GROUND_Y);
    drawParkTree(Math.floor(tx + 90), GROUND_Y);
  }

  // Flower beds
  ctx.fillStyle = '#4caf50';
  ctx.fillRect(0, GROUND_Y - 8, canvas.width, 8);
  const flowerOff = -(nearParallax % 20);
  for (let fx = flowerOff - 20; fx < canvas.width + 20; fx += 20) {
    const hash = (Math.floor(fx + nearParallax) * 13) & 7;
    if (hash < 3) {
      ctx.fillStyle = hash === 0 ? '#f44336' : hash === 1 ? '#ffeb3b' : '#e91e63';
      ctx.fillRect(Math.floor(fx), GROUND_Y - 10 - (hash * 2), 4, 4);
    }
  }
}

function drawParkArch(ax) {
  if (ax < -100 || ax > canvas.width + 100) return;
  ax = Math.floor(ax);

  // Two pillars
  ctx.fillStyle = '#78909c';
  ctx.fillRect(ax - 40, GROUND_Y - 110, 12, 110);
  ctx.fillRect(ax + 28, GROUND_Y - 110, 12, 110);

  // Arch top
  ctx.fillStyle = '#607d8b';
  ctx.fillRect(ax - 45, GROUND_Y - 120, 90, 14);

  // "GORKY PARK" text
  ctx.fillStyle = '#fff';
  ctx.font = '8px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('GORKY PARK', ax, GROUND_Y - 108);

  // Decorative top
  ctx.fillStyle = '#90a4ae';
  ctx.fillRect(ax - 30, GROUND_Y - 130, 60, 10);
  // Small ornament
  ctx.fillRect(ax - 5, GROUND_Y - 138, 10, 8);
}

function drawParkBench(bx) {
  if (bx < -40 || bx > canvas.width + 40) return;
  // Bench seat
  ctx.fillStyle = '#795548';
  ctx.fillRect(bx, GROUND_Y - 18, 30, 4);
  // Bench legs
  ctx.fillStyle = '#4e342e';
  ctx.fillRect(bx + 2, GROUND_Y - 14, 3, 14);
  ctx.fillRect(bx + 25, GROUND_Y - 14, 3, 14);
  // Bench back
  ctx.fillStyle = '#795548';
  ctx.fillRect(bx, GROUND_Y - 30, 30, 3);
  ctx.fillRect(bx, GROUND_Y - 24, 30, 3);
}

function drawParkTree(tx, groundY) {
  if (tx < -40 || tx > canvas.width + 40) return;
  // Trunk
  ctx.fillStyle = '#5d4037';
  ctx.fillRect(tx + 8, groundY - 60, 6, 60);

  // Crown layers (bushy deciduous tree)
  ctx.fillStyle = '#388e3c';
  ctx.beginPath();
  ctx.arc(tx + 11, groundY - 75, 22, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#43a047';
  ctx.beginPath();
  ctx.arc(tx + 5, groundY - 65, 16, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(tx + 18, groundY - 68, 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#4caf50';
  ctx.beginPath();
  ctx.arc(tx + 11, groundY - 82, 12, 0, Math.PI * 2);
  ctx.fill();
}

// ---- Scene 2: Moscow City (Modern Skyscrapers) ----
function drawMoscowCity(parallax) {
  // Far background: city skyline silhouette
  const farParallax = parallax * 0.2;

  // Distant skyscrapers
  const skyscrapers = [
    { x: 0, w: 40, h: 200, color: '#37474f' },
    { x: 60, w: 30, h: 160, color: '#455a64' },
    { x: 110, w: 50, h: 240, color: '#37474f' },  // Federation Tower
    { x: 180, w: 35, h: 220, color: '#546e7a' },   // Mercury Tower
    { x: 240, w: 45, h: 180, color: '#455a64' },
    { x: 310, w: 55, h: 260, color: '#37474f' },   // OKO Tower
    { x: 390, w: 30, h: 150, color: '#546e7a' },
    { x: 440, w: 40, h: 190, color: '#455a64' },
    { x: 500, w: 50, h: 230, color: '#37474f' },
    { x: 570, w: 35, h: 170, color: '#546e7a' },
    { x: 630, w: 45, h: 210, color: '#455a64' },
    { x: 700, w: 30, h: 140, color: '#37474f' },
    { x: 750, w: 55, h: 250, color: '#546e7a' },
    { x: 830, w: 40, h: 180, color: '#455a64' },
  ];
  const patternW = 900;
  const startOff = -(farParallax % patternW);

  for (let shift = startOff - patternW; shift < canvas.width + patternW; shift += patternW) {
    for (const s of skyscrapers) {
      const sx = Math.floor(shift + s.x);
      if (sx + s.w < -60 || sx > canvas.width + 60) continue;

      ctx.fillStyle = s.color;
      ctx.fillRect(sx, GROUND_Y - s.h, s.w, s.h);

      // Glass windows (horizontal strips)
      ctx.fillStyle = '#78909c';
      for (let wy = GROUND_Y - s.h + 6; wy < GROUND_Y - 4; wy += 8) {
        ctx.fillRect(sx + 2, wy, s.w - 4, 3);
      }

      // Some lit windows (warm glow for sunset scene)
      ctx.fillStyle = '#ffab40';
      for (let wy = GROUND_Y - s.h + 8; wy < GROUND_Y - 8; wy += 16) {
        for (let wx = sx + 4; wx < sx + s.w - 4; wx += 10) {
          const hash = (Math.floor(wx) * 11 + wy * 7) & 0xF;
          if (hash < 4) {
            ctx.fillRect(Math.floor(wx), wy, 4, 5);
          }
        }
      }

      // Roof antenna/spire on tall buildings
      if (s.h > 200) {
        ctx.fillStyle = '#90a4ae';
        ctx.fillRect(sx + s.w / 2 - 1, GROUND_Y - s.h - 20, 3, 20);
        // Blinking light
        ctx.fillStyle = '#ff1744';
        ctx.fillRect(sx + s.w / 2 - 2, GROUND_Y - s.h - 22, 5, 4);
      }
    }
  }

  // Bridge in mid-ground
  const midParallax = parallax * 0.5;
  const bridgeSp = 1500;
  const bridgeOff = -(midParallax % bridgeSp);
  for (let bx = bridgeOff - bridgeSp; bx < canvas.width + bridgeSp; bx += bridgeSp) {
    drawBridge(Math.floor(bx + 300));
  }

  // River in foreground
  ctx.fillStyle = '#0d47a1';
  ctx.fillRect(0, GROUND_Y - 20, canvas.width, 20);
  ctx.fillStyle = '#1565c0';
  const waveOff = -(parallax * 0.4) % 30;
  for (let wx = waveOff - 30; wx < canvas.width + 30; wx += 30) {
    ctx.fillRect(Math.floor(wx), GROUND_Y - 16, 15, 2);
    ctx.fillRect(Math.floor(wx) + 8, GROUND_Y - 8, 12, 2);
  }
}

function drawBridge(bx) {
  if (bx < -200 || bx > canvas.width + 200) return;

  // Bridge deck
  ctx.fillStyle = '#607d8b';
  ctx.fillRect(bx - 80, GROUND_Y - 35, 160, 8);

  // Bridge supports
  ctx.fillStyle = '#455a64';
  ctx.fillRect(bx - 70, GROUND_Y - 35, 6, 35);
  ctx.fillRect(bx + 64, GROUND_Y - 35, 6, 35);
  ctx.fillRect(bx - 3, GROUND_Y - 35, 6, 35);

  // Cable/arch
  ctx.fillStyle = '#78909c';
  ctx.fillRect(bx - 2, GROUND_Y - 55, 4, 20);
  // Cables
  ctx.strokeStyle = '#90a4ae';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(bx - 70, GROUND_Y - 35);
  ctx.lineTo(bx, GROUND_Y - 55);
  ctx.lineTo(bx + 70, GROUND_Y - 35);
  ctx.stroke();
}

// ---- Draw Kilometer Markers ----
function drawKmMarkers() {
  for (let km = 1; km <= RACE_DISTANCE_KM; km++) {
    const meterPos = km * METERS_PER_KM;
    const screenX = (meterPos * PIXELS_PER_METER) - game.worldX + RUNNER_X;

    if (screenX < -60 || screenX > canvas.width + 60) continue;

    const isPitstop = km % PITSTOP_EVERY_KM === 0 && km < RACE_DISTANCE_KM;
    const isFinish = km === RACE_DISTANCE_KM;
    const sx = Math.floor(screenX);

    // Marker post
    ctx.fillStyle = '#b0bec5';
    ctx.fillRect(sx, GROUND_Y - 55, 4, 55);

    // Sign board (larger, colored by type)
    if (isFinish) {
      // Finish arch
      ctx.fillStyle = '#fff';
      ctx.fillRect(sx - 20, GROUND_Y - 70, 44, 20);
      ctx.fillStyle = '#e63946';
      ctx.fillRect(sx - 20, GROUND_Y - 70, 44, 3);
      ctx.fillRect(sx - 20, GROUND_Y - 53, 44, 3);
      ctx.fillStyle = '#2d3436';
      ctx.font = 'bold 11px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('FINISH', sx + 2, GROUND_Y - 56);

      // Checkered pattern on both sides
      for (let side = -1; side <= 1; side += 2) {
        const cx = sx + side * 25;
        for (let row = 0; row < 10; row++) {
          for (let col = 0; col < 3; col++) {
            ctx.fillStyle = (row + col) % 2 === 0 ? '#fff' : '#000';
            ctx.fillRect(cx - 4 + col * 5, GROUND_Y - 70 + row * 5, 5, 5);
          }
        }
      }
    } else if (isPitstop) {
      // Pitstop sign - green with water icon
      ctx.fillStyle = '#00b894';
      ctx.fillRect(sx - 16, GROUND_Y - 72, 36, 22);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(km + 'km', sx + 2, GROUND_Y - 57);
      // Water drop icon
      ctx.fillStyle = '#74b9ff';
      ctx.fillRect(sx + 14, GROUND_Y - 70, 4, 6);

      // Water table
      ctx.fillStyle = '#00b894';
      ctx.fillRect(sx + 15, GROUND_Y - 20, 35, 4);
      ctx.fillStyle = '#e0e0e0';
      ctx.fillRect(sx + 15, GROUND_Y - 20, 35, 1);
      // Table legs
      ctx.fillStyle = '#00b894';
      ctx.fillRect(sx + 17, GROUND_Y - 16, 3, 16);
      ctx.fillRect(sx + 44, GROUND_Y - 16, 3, 16);
      // Water cups
      ctx.fillStyle = '#74b9ff';
      for (let c = 0; c < 3; c++) {
        ctx.fillRect(sx + 20 + c * 10, GROUND_Y - 28, 6, 8);
        // Cup rim
        ctx.fillStyle = '#fff';
        ctx.fillRect(sx + 19 + c * 10, GROUND_Y - 28, 8, 1);
        ctx.fillStyle = '#74b9ff';
      }
    } else {
      // Regular km sign - white with red accent
      ctx.fillStyle = '#fff';
      ctx.fillRect(sx - 14, GROUND_Y - 70, 32, 20);
      // Red border
      ctx.fillStyle = '#e63946';
      ctx.fillRect(sx - 14, GROUND_Y - 70, 32, 2);
      ctx.fillRect(sx - 14, GROUND_Y - 52, 32, 2);
      ctx.fillRect(sx - 14, GROUND_Y - 70, 2, 20);
      ctx.fillRect(sx + 16, GROUND_Y - 70, 2, 20);
      // Number
      ctx.fillStyle = '#2d3436';
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(km, sx + 2, GROUND_Y - 56);
    }
  }
}

// ---- Draw HUD ----
function drawHUD() {
  const currentKm = game.distance / METERS_PER_KM;
  const minutes = Math.floor(game.time / 60);
  const seconds = Math.floor(game.time % 60);
  const hours = Math.floor(minutes / 60);
  const mins = minutes % 60;

  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(10, 10, 200, 110);

  ctx.fillStyle = '#f1faee';
  ctx.font = '12px monospace';
  ctx.textAlign = 'left';

  ctx.fillText('Distance: ' + currentKm.toFixed(2) + ' / 42 km', 20, 30);
  ctx.fillText('Speed: ' + (game.speed * 3.6).toFixed(1) + ' km/h', 20, 48);
  ctx.fillText('Time: ' + hours + 'h ' + String(mins).padStart(2, '0') + 'm ' + String(seconds % 60).padStart(2, '0') + 's', 20, 66);

  // Stamina bar
  ctx.fillText('Stamina:', 20, 84);
  ctx.fillStyle = '#2d3436';
  ctx.fillRect(90, 74, 100, 12);
  ctx.fillStyle = game.stamina > 30 ? '#00b894' : '#e17055';
  ctx.fillRect(90, 74, (game.stamina / game.maxStamina) * 100, 12);

  // Power bar
  ctx.fillStyle = '#f1faee';
  ctx.fillText('Power:', 20, 102);
  ctx.fillStyle = '#2d3436';
  ctx.fillRect(90, 92, 100, 12);
  ctx.fillStyle = '#6c5ce7';
  ctx.fillRect(90, 92, (game.power / game.maxPower) * 100, 12);

  // Press frequency hint
  const freq = getPressFrequency();
  ctx.fillStyle = '#f1faee';
  ctx.font = '10px monospace';
  ctx.textAlign = 'right';
  ctx.fillText('Press rate: ' + freq.toFixed(1) + '/s', canvas.width - 20, 30);
}

// ---- Draw Title Screen ----
function drawTitle() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#e63946';
  ctx.font = '28px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('ISKANDER MARATHON', canvas.width / 2, 120);

  ctx.fillStyle = '#f1faee';
  ctx.font = '14px monospace';
  ctx.fillText('Moscow Marathon Simulator', canvas.width / 2, 155);

  ctx.font = '12px monospace';
  ctx.fillStyle = '#a0aec0';
  ctx.fillText('42 km of pure determination', canvas.width / 2, 190);

  ctx.fillStyle = '#ffeaa7';
  ctx.font = '16px monospace';
  ctx.fillText('Press SPACE to start', canvas.width / 2, 260);

  ctx.fillStyle = '#718096';
  ctx.font = '10px monospace';
  ctx.fillText('Tap SPACE rapidly to run. Manage your stamina!', canvas.width / 2, 310);
  ctx.fillText('Water stations every 5 km. No saves!', canvas.width / 2, 328);
}

// ---- Draw Finish Screen ----
function drawFinish() {
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const hours = Math.floor(game.finishTime / 3600);
  const mins = Math.floor((game.finishTime % 3600) / 60);
  const secs = Math.floor(game.finishTime % 60);

  if (game.raceResult === 'win') {
    ctx.fillStyle = '#00b894';
    ctx.font = '28px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('RACE COMPLETE!', canvas.width / 2, 120);
  } else {
    ctx.fillStyle = '#e17055';
    ctx.font = '28px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('RACE FINISHED', canvas.width / 2, 120);
  }

  ctx.fillStyle = '#f1faee';
  ctx.font = '16px monospace';
  ctx.fillText('Time: ' + hours + 'h ' + String(mins).padStart(2, '0') + 'm ' + String(secs).padStart(2, '0') + 's', canvas.width / 2, 170);
  ctx.fillText('Distance: 42.00 km', canvas.width / 2, 200);

  const avgSpeed = (TOTAL_METERS / game.finishTime) * 3.6;
  ctx.fillText('Avg Speed: ' + avgSpeed.toFixed(1) + ' km/h', canvas.width / 2, 230);

  ctx.fillStyle = '#ffeaa7';
  ctx.font = '14px monospace';
  ctx.fillText('Press SPACE to restart', canvas.width / 2, 300);
}

// ---- Main Loop ----
function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05); // cap dt
  lastTime = timestamp;

  // Handle state transitions from input
  if (spaceJustPressed && game.state === 'title') {
    spaceJustPressed = false;
    game.state = 'running';
  }
  if (spaceJustPressed && game.state === 'finished') {
    spaceJustPressed = false;
    resetGame();
  }

  update(dt);

  // Draw
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (game.state === 'title') {
    drawTitle();
  } else if (game.state === 'running') {
    drawSky();
    drawBackground();
    drawGround();
    drawKmMarkers();
    drawRunner();
    drawHUD();
  } else if (game.state === 'finished') {
    drawSky();
    drawBackground();
    drawGround();
    drawKmMarkers();
    drawRunner();
    drawHUD();
    drawFinish();
  }

  requestAnimationFrame(gameLoop);
}

function resetGame() {
  game.state = 'title';
  game.distance = 0;
  game.speed = 0;
  game.stamina = 100;
  game.power = 100;
  game.time = 0;
  game.pressTimestamps = [];
  game.lastPressTime = 0;
  game.worldX = 0;
  game.finishTime = null;
  game.raceResult = null;
  game.runner.frame = 0;
  game.runner.frameTimer = 0;
  game.runner.bobY = 0;
  game.runner.stepping = false;
}

// Start
requestAnimationFrame(gameLoop);
</script>
